<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titolo della pagina -->
    <title>Todo App</title>
</head>
<body>

    <h1>La mia Todo List</h1>

    <!-- Form per aggiungere un nuovo task -->
    <form action="/add" method="POST">
        <input type="text" name="todo" placeholder="Scrivi un task...">
        <button type="submit">Aggiungi</button>
    </form>

    <!-- Lista dei task -->
    <ul>
        {% for todo in todos %}
            <li>
                {{ todo['task'] }}
                <!-- Link per eliminare il task tramite il suo id -->
                <a href="/delete/{{ todo['id'] }}">Elimina</a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
